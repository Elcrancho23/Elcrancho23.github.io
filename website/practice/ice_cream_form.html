<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Who wants ice cream?</title>
  <script src="../js/validate.js"></script>
</head>
<body>
  <form action="https://httpbin.org/post" method="post">
  <label for="yourname">Your name:</label>
    <input type="text" id="yourname" name="yourname">
    <br>
 <label for="email">What is your email address?</label>
    <input type="email" id="email" name="email">
    <br>
 <label for="phone">What is your phone number?</label>
    <input type="tel" id="phone" name="phone">
    <br>
 <label for="num_people">How many people will you bring with you to the party?</label>
    <input type="text" id="num_people" name="num_people">
    <br>
 <div>
      <span>What is your favorite flavor of ice cream?</span><br>
      <input type="checkbox" id="flavor_vanilla" name="flavors[]" value="Vanilla">
      <label for="flavor_vanilla">Vanilla</label>
      <br>
 <input type="checkbox" id="flavor_chocchip" name="flavors[]" value="Chocolate Chip">
      <label for="flavor_chocchip">Chocolate Chip</label>
      <br>
 <input type="checkbox" id="flavor_strawberry" name="flavors[]" value="Strawberry">
      <label for="flavor_strawberry">Strawberry</label>
      <br>
  <input type="checkbox" id="flavor_other_cb" name="flavors[]" value="Other">
      <label for="flavor_other_cb">Other</label>
      <input type="text" id="flavor_other" name="flavor_other" placeholder="Please specify">
      <br>
    </div>
 <div>
      <span>Which toppings do you like?</span><br>
      <input type="checkbox" id="topping_sprinkles" name="toppings[]" value="Sprinkles">
      <label for="topping_sprinkles">Sprinkles</label>
      <br>
                    <input type="checkbox" id="topping_magic" name="toppings[]" value="Magic Shell">
      <label for="topping_magic">Magic Shell</label>
      <br>
 <input type="checkbox" id="topping_chocchips" name="toppings[]" value="Chocolate Chips">
      <label for="topping_chocchips">Chocolate Chips</label>
      <br>
               <input type="checkbox" id="topping_gummy" name="toppings[]" value="Gummy Bears">
      <label for="topping_gummy">Gummy Bears</label>
      <br>
 <input type="checkbox" id="topping_other_cb" name="toppings[]" value="Other">
      <label for="topping_other_cb">Other</label>
      <input type="text" id="topping_other" name="topping_other" placeholder="Please specify">
      <br>
    </div>
 <label for="entertainment">What kind of entertainment should we have at the party?</label>
    <input type="text" id="entertainment" name="entertainment">
    <br>
 <label for="comments">Do you have any other suggestions or comments?</label>
    <br>
    <textarea id="comments" name="comments" rows="4" cols="40"></textarea>
    <br>
 <button type="submit">Submit</button>
 </form>
</body>
</html>
