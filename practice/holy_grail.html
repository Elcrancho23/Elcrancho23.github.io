<!DOCTYPE html>
<html lang="en">
<head>
<title> behold! The holy grail!</title>
<style>
    html, body { 
            background: #fff;
            margin: 0;
            padding: 0;
               }
    .container {
    width: 900px;
            margin: 0 auto;
        border-top: 2px solid #222;
               }
    .header    {
     background: #0b7b18;
             border: none;
           height: 85px;
          display: flex;
         align-items: center;
      justify-content: center;
          font-size: 48px;
      font-family: Georgia, serif;
      font-weight: normal;
            letter-spacing: 1px;
      margin-top: 15px;
           margin-bottom: 15px;
                }
     .mainrow   {
       width: 100%;
      display: flex;
         flex-direction: row;
            gap: 15px;
      margin-bottom: 15px;
      height: 260px;
             }  
 .side      {
       width: 180px;
          background: #0b7b18;
      display: flex;
            align-items: center;
      justify-content: center;
          font-size: 44px;
          font-family: Georgia, serif;
      font-weight: normal;
    }
.center   {
      flex: 1 1 auto;
      background: #0b7b18;
      display: flex;
             align-items: center;
      justify-content: center;
           font-size: 42px;
             font-family: Georgia, serif;
           font-weight: normal;
                 }
     .footer{
       background: #0b7b18;
      height: 85px;
              display: flex;
      align-items: center;
             justify-content: center;
      font-size: 48px;
          font-family: Georgia, serif;
      font-weight: normal;
           letter-spacing: 1px;
           margin-bottom: 18px;
    }
      .valid-links {
         width: 900px;
           margin: 0 auto;
         font-size: 12px;
         color: #000;
    }
         .valid-links a { color: #0645AD; text-decoration: underline; margin-right: 8px; }
  </style>
</head>
          <body>
         <div class="container">
          <div class="header">HEADER</div>
          <div class="mainrow">
           <div class="side">SIDE</div>
         <div class="center">MAIN</div>
          <div class="side">SIDE</div>
             </div>
         <div class="footer">FOOT</div>
       </div>
         </body>
            </html>
