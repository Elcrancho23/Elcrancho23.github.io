<!DOCTYPE html>
<html lang="en">
<head>
<title>Here is my self portrait!</title> 
 <style> 
canvas{
border:black 1px solid;
      } 
</style> 
</head> 
<body>
<h1> Here is my self portrait!</h1>
 <canvas id= "canvas" width= "800" height= "800">
 </canvas>
<script>
//canvas setup
const canvas= document.getElementById("canvas");
const ctx=canvas.getContext("2d");
//head
ctx.fillStyle="#f4c8a5";
ctx.beginPath();
 ctx.ellipse(400, 420, 180, 220, 0, 0, Math.PI * 2);
 ctx.fill();
// Left Ear 
    ctx.fillStyle ="#f4c8a5";
  ctx.beginPath();
   ctx.ellipse(220, 420, 35, 50, 0, 0, Math.PI * 2);
   ctx.fill();
// Right Ear
          ctx.fillStyle="#f4c8a5";
        ctx.beginPath();
           ctx.ellipse(580, 420, 35, 50, 0, 0, Math.PI * 2);
        ctx.fill();
      // oval left ear 
            ctx.fillStyle ="#e8b393";
          ctx.beginPath();
          ctx.ellipse(220, 420, 15, 25, 0, 0, Math.PI * 2);
           ctx.fill();
       // oval right ear 
           ctx.fillStyle="#e8b393";
        ctx.beginPath();
          ctx.ellipse(580, 420, 15, 25, 0, 0, Math.PI * 2);
           ctx.fill();
       // Top part of hair
       ctx.fillStyle="#3d2817";
        ctx.beginPath();
        ctx.ellipse(400, 220, 200, 130, 0, 0, Math.PI * 2);
        ctx.fill();
    // Left side of hair 
       ctx.beginPath();
        ctx.ellipse(260, 280, 70, 90, -0.3, 0, Math.PI * 2);
        ctx.fill();
   //Right side of hair
     ctx.beginPath();
     ctx.ellipse(540, 280, 70, 90, 0.3, 0, Math.PI * 2);
      ctx.fill();
    //white part of eye left 
   ctx.fillStyle="#ffffff";
        ctx.beginPath();
        ctx.ellipse(340, 400, 35, 25, 0, 0, Math.PI * 2);
        ctx.fill();
// white part of eye right  
  ctx.fillStyle= "#ffffffa";
        ctx.beginPath();
        ctx.ellipse(460, 400, 35, 25, 0, 0, Math.PI * 2);
        ctx.fill();
//Brown part of eye right
            ctx.fillStyle ="#3d2817";
            ctx.beginPath();
          ctx.arc(460, 400, 18, 0, Math.PI * 2);
        ctx.fill();
// Brown part of eye left
  ctx.fillStyle="#3d2817"
   ctx.beginPath();
    ctx.arc(340, 400, 18, 0, Math.PI * 2);
     ctx.fill();
// Left eyebrow 
           ctx.fillStyle="#3d2817";
           ctx.beginPath();
         ctx.ellipse(340, 350, 45, 12, -0.1, 0, Math.PI * 2);
         ctx.fill();
// Right eyebrow
    ctx.fillStyle="#3d2817";
         ctx.beginPath();
      ctx.ellipse(460, 350, 45, 12, 0.1, 0, Math.PI * 2);
        ctx.fill();
     //Nose 
 ctx.fillStyle="#e8b393";
     ctx.beginPath();
    ctx.moveTo(400, 430);     
 ctx.lineTo(375, 470);  
   ctx.lineTo(425, 470);      
ctx.closePath();
      ctx.fill();
// Mouth 

</script>
</body>
</html>
